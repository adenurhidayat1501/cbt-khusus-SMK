version: '3.8'

services:
  app:
    build: .
    container_name: saduci_cbt_app
    restart: always
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_NAME=saduci_cbt
      - DB_USER=saduci_cbt
      - DB_PASS=saducipassword123
    depends_on:
      - db
    volumes:
      - cbt_uploads:/var/www/html/uploads
      - cbt_backups:/var/www/html/backups
      - cbt_logs:/var/www/html/application/logs

  db:
    image: mariadb:10.6
    container_name: saduci_cbt_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword123
      - MYSQL_DATABASE=saduci_cbt
      - MYSQL_USER=saduci_cbt
      - MYSQL_PASSWORD=saducipassword123
    volumes:
      - db_data:/var/lib/mysql
      - ./assets/app/db/master.sql:/docker-entrypoint-initdb.d/master.sql:ro

volumes:
  db_data:
  cbt_uploads:
  cbt_backups:
  cbt_logs:

